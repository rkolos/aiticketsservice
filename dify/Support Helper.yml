            \ Используй историю переписки, чтобы понять контекст проблемы\n      \
            \          2. Используй контекст из базы знаний для предоставления точной\
            \ информации\n                3. Ответь на текущий вопрос пользователя,\
            \ учитывая всю доступную информацию\n                4. Если в истории\
