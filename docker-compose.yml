version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: ticket-ai-redis
    ports:
      - '6379:6379'
    volumes:
      - './docker/redis_data:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ticket-ai-worker
    volumes:
      - './src:/app/src'
      - '/app/node_modules'
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

